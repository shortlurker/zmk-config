# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
# Left Central
#  - board: nice_nano_v2
#    shield: sofle_left
#    artifact-name: sofle_left_central
#    snippet: studio-rpc-usb-uart
# Left Peripheral
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: sofle_left_peripheral
# Right Peripheral
  - board: nice_nano_v2
    shield: sofle_right
    artifact-name: sofle_right_peripheral
# Dongle Display OLED
  - board: nice_nano_v2
    shield: sofle_dongle_oled dongle_display   
    artifact-name: sofle_dongle_oled_central
    snippet: studio-rpc-usb-uart
# Dongle Display Prospector xiao
#  - board: seeeduino_xiao_ble
#    shield: sofle_dongle_prospector_xiao prospector_adapter
#    artifact-name: sofle_dongle_prospector_xiao_central
#    snippet: studio-rpc-usb-uart
# Dongle Display Prospector nice nano
- board: nice_nano_v2
  shield: sofle_dongle_prospector_nn prospector_adapter
  artifact-name: sofle_dongle_prospector_nn_central
  snippet: studio-rpc-usb-uart
# Settings Reset nice nano
#  - board: nice_nano_v2
#    shield: settings_reset_nice_nano
# Settings Reset xiao 
#  - board: seeeduino_xiao_ble
#    shield: settings_reset_xiao_ble